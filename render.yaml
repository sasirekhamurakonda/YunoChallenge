services:
  - type: web
    name: payment-capture-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qs42uzbpHrmw@ep-wandering-cloud-aohsu6pd-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: MAX_RETRIES
        value: "3"
      - key: RETRY_BASE_DELAY_SECONDS
        value: "30"
      - key: GATEWAY_SUCCESS_RATE
        value: "0.85"
      - key: EXECUTION_POLL_INTERVAL_SECONDS
        value: "60"
      - key: ALERT_THRESHOLD_HOURS
        value: "48"
