openapi: 3.1.0
info:
  title: Payment Capture Scheduling Service
  description: |
    Automated payment capture scheduling service for Serenity Cruises.
    Schedules, executes, and retries payment captures to eliminate revenue leakage
    from expired authorizations.
  version: 1.0.0
  contact:
    name: Yuno Challenge
servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: health
    description: Service health (used by UptimeRobot keep-alive ping)
  - name: captures
    description: Schedule and manage payment captures
  - name: execution
    description: Capture execution engine
  - name: alerts
    description: Deadline alert monitoring (stretch goal)
  - name: stats
    description: Aggregate statistics (stretch goal)

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Lightweight liveness probe. Pinged every 5 min by UptimeRobot to prevent Render free-tier sleep.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0

  /captures:
    post:
      tags: [captures]
      summary: Schedule a new capture
      operationId: createCapture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptureRequest'
      responses:
        '201':
          description: Capture scheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledCapture'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [captures]
      summary: List scheduled captures
      operationId: listCaptures
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaptureStatus'
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
        - name: booking_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of captures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaptures'

  /captures/{id}:
    get:
      tags: [captures]
      summary: Get a specific capture
      operationId: getCapture
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: Capture details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledCapture'
        '404':
          $ref: '#/components/responses/NotFound'

  /captures/{id}/cancel:
    post:
      tags: [captures]
      summary: Cancel a pending capture
      operationId: cancelCapture
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: Capture cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledCapture'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /captures/{id}/attempts:
    get:
      tags: [captures]
      summary: List attempts for a capture
      operationId: listAttempts
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: List of capture attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaptureAttempt'
        '404':
          $ref: '#/components/responses/NotFound'

  /execution/trigger:
    post:
      tags: [execution]
      summary: Manually trigger execution engine (demo)
      operationId: triggerExecution
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRequest'
      responses:
        '200':
          description: Execution summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'

  /captures/alerts:
    get:
      tags: [alerts]
      summary: Get captures at risk of missing authorization window
      operationId: getAlerts
      parameters:
        - name: alert_type
          in: query
          schema:
            type: string
            enum: [scheduling_conflict, expiry_imminent]
        - name: threshold_hours
          in: query
          schema:
            type: integer
            default: 48
      responses:
        '200':
          description: List of capture alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'

  /stats:
    get:
      tags: [stats]
      summary: Batch capture statistics
      operationId: getStats
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

components:
  parameters:
    CaptureId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict with existing resource or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CaptureStatus:
      type: string
      enum: [pending, processing, captured, retrying, failed, cancelled]

    CreateCaptureRequest:
      type: object
      required: [booking_id, payment_reference, amount, scheduled_capture_at]
      properties:
        booking_id:
          type: string
          minLength: 1
          maxLength: 100
          example: SC-2026-00123
        payment_reference:
          type: string
          minLength: 1
          maxLength: 200
          example: auth_yuno_abc123xyz
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 99999999.99
          example: 1250.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: EUR
          example: EUR
        scheduled_capture_at:
          type: string
          format: date-time
          example: '2026-07-15T09:00:00Z'
        auth_expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T23:59:59Z'

    ScheduledCapture:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
        payment_reference:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          $ref: '#/components/schemas/CaptureStatus'
        scheduled_capture_at:
          type: string
          format: date-time
        auth_expires_at:
          type: string
          format: date-time
          nullable: true
        retry_count:
          type: integer
        max_retries:
          type: integer
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        captured_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CaptureAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scheduled_capture_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
        status:
          type: string
          enum: [success, failure]
        failure_reason:
          type: string
          nullable: true
        gateway_response:
          type: object
          nullable: true
        attempted_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          nullable: true

    PaginatedCaptures:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledCapture'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer

    TriggerRequest:
      type: object
      properties:
        batch_size:
          type: integer
          default: 100
          minimum: 1
          maximum: 500

    ExecutionResult:
      type: object
      properties:
        processed:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        retrying:
          type: integer
        duration_ms:
          type: integer

    AlertItem:
      type: object
      properties:
        capture_id:
          type: string
          format: uuid
        booking_id:
          type: string
        payment_reference:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          $ref: '#/components/schemas/CaptureStatus'
        alert_type:
          type: string
          enum: [scheduling_conflict, expiry_imminent]
        alert_message:
          type: string
        scheduled_capture_at:
          type: string
          format: date-time
        auth_expires_at:
          type: string
          format: date-time
        hours_until_expiry:
          type: number

    AlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'
        total:
          type: integer

    StatsResponse:
      type: object
      properties:
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
        totals:
          type: object
          properties:
            scheduled: { type: integer }
            captured: { type: integer }
            failed: { type: integer }
            retrying: { type: integer }
            pending: { type: integer }
            cancelled: { type: integer }
        success_rate_pct:
          type: number
          format: double
        avg_capture_latency_hours:
          type: number
          format: double
          nullable: true
        failure_breakdown:
          type: object
          additionalProperties:
            type: integer

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
